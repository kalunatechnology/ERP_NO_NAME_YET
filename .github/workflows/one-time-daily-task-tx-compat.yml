name: One-time Daily Task transaction compatibility patch

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply transaction compatibility patch
        run: python backend-express/scripts/patch_daily_task_tx_compat.py
      - name: Validate patch
        run: git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet -- backend-express/src/modules/projects/projects.service.ts; then
            echo 'No change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend-express/src/modules/projects/projects.service.ts
          git commit -m 'fix(projects): harden Daily Task updates during schema lag'
          git push origin HEAD:master
