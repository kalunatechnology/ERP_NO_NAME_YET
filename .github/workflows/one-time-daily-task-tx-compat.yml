name: One-time Daily Task transaction compatibility patch

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Patch Daily Task transaction compatibility
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend-express/src/modules/projects/projects.service.ts')
          text = path.read_text()

          old_import = "import type { Prisma } from '@prisma/client';"
          new_import = "import { Prisma } from '@prisma/client';"
          if old_import not in text:
              raise SystemExit('Expected Prisma type-only import not found')
          text = text.replace(old_import, new_import, 1)

          anchor = "const PROJECT_TRANSACTION_OPTIONS = { maxWait: 5_000, timeout: 30_000 } as const;\n"
          if anchor not in text:
              raise SystemExit('PROJECT_TRANSACTION_OPTIONS anchor not found')
          insert = anchor + """
const DAILY_TASK_LEGACY_MUTATION_SELECT = {
  tenant_id: true,
  company_id: true,
  created_by_id: true,
  id: true,
  weekly_task_id: true,
  owner_id: true,
  title: true,
  description: true,
  planned_date: true,
  time_slot: true,
  output_result: true,
  notes: true,
  progress: true,
  status: true,
  is_blocked: true,
  block_reason: true,
  created_at: true,
  updated_at: true,
} as const;
"""
          text = text.replace(anchor, insert, 1)

          start = text.index("  private static async dailyTaskContext")
          end = text.index("  static async assertCanOperateDailyTask", start)
          helpers = r'''  private static async dailyTaskOutputContractAvailable(db: any = prisma): Promise<boolean> {
    try {
      const rows = await db.$queryRaw(Prisma.sql`
        SELECT COUNT(*)::int AS "count"
        FROM information_schema.columns
        WHERE table_schema = ANY (current_schemas(false))
          AND table_name = 'project_daily_task'
          AND column_name IN (
            'output_target',
            'output_similarity_score',
            'output_review_category'
          )
      `) as Array<{ count: number | string | bigint }>;
      return Number(rows[0]?.count ?? 0) === 3;
    } catch (error) {
      console.warn('[ProjectsService] Unable to inspect Daily Task output schema readiness:', error);
      return false;
    }
  }

  private static async dailyTaskRecord(
    dailyTaskId: string,
    companyId: string | undefined,
    db: any = prisma,
  ): Promise<any | null> {
    const rows = companyId
      ? await db.$queryRaw(Prisma.sql`
          SELECT *
          FROM "project_daily_task"
          WHERE "id" = ${dailyTaskId}
            AND "company_id" = ${companyId}
          LIMIT 1
        `)
      : await db.$queryRaw(Prisma.sql`
          SELECT *
          FROM "project_daily_task"
          WHERE "id" = ${dailyTaskId}
          LIMIT 1
        `);
    return (rows as any[])[0] ?? null;
  }

  private static async dailyTaskContext(dailyTaskId: string, companyId: string, db: any = prisma) {
    // Raw physical-row read is deliberate here. During a rolling deployment the
    // generated Prisma model can be newer than the production table; SELECT *
    // returns only columns that physically exist and therefore cannot trigger
    // Prisma P2022 merely because a newly declared optional contract is pending.
    const task = await this.dailyTaskRecord(dailyTaskId, companyId, db);
    if (!task) throw new NotFoundError('DailyTask');
    const weekly = await db.project_weekly_task.findFirst({ where: { id: task.weekly_task_id, company_id: companyId } });
    const mainTask = weekly
      ? await db.project_main_task.findFirst({ where: { id: weekly.main_task_id, company_id: companyId } })
      : null;
    if (!weekly || !mainTask) throw new ValidationError('Hierarchy Daily Task tidak valid.');
    return { task, weekly, mainTask, projectId: mainTask.project_id as string };
  }

'''
          text = text[:start] + helpers + text[end:]

          old_dt = """        const dt = await tx.project_daily_task.findFirst({
          where: { id: params.dailyTaskId, ...(companyId ? { company_id: companyId } : {}) },
        });"""
          new_dt = """        const dt = await this.dailyTaskRecord(params.dailyTaskId, companyId, tx);"""
          if old_dt not in text:
              raise SystemExit('Daily Task recalculate read block not found')
          text = text.replace(old_dt, new_dt, 1)

          old_rollup = """            const dailyTasks = await tx.project_daily_task.findMany({
              where: { weekly_task_id: weeklyId, ...(companyId ? { company_id: companyId } : {}) },
            });"""
          new_rollup = """            const dailyTasks = await tx.project_daily_task.findMany({
              where: { weekly_task_id: weeklyId, ...(companyId ? { company_id: companyId } : {}) },
              select: { progress: true, is_blocked: true, status: true },
            });"""
          if old_rollup not in text:
              raise SystemExit('Daily Task weekly rollup block not found')
          text = text.replace(old_rollup, new_rollup, 1)

          old_recalc_update = """          await tx.project_daily_task.update({
            where: { id: dt.id },
            data: { progress: calculatedProgress, status: calculatedStatus, updated_at: new Date() },
          });"""
          new_recalc_update = """          await tx.project_daily_task.update({
            where: { id: dt.id },
            data: { progress: calculatedProgress, status: calculatedStatus, updated_at: new Date() },
            select: { id: true },
          });"""
          if old_recalc_update not in text:
              raise SystemExit('Daily Task recalculate update block not found')
          text = text.replace(old_recalc_update, new_recalc_update, 1)

          method_start = text.index("  static async updateDailyTaskProgress")
          method_end = text.index("/**\n * reportBlocked", method_start)
          new_method = r'''  static async updateDailyTaskProgress(dailyTaskId: string, data: any, user: any, companyId: string) {
    // Resolve physical DB readiness before opening the mutation transaction.
    // This prevents a missing-column query from poisoning an interactive
    // transaction and turning an expected deployment-order mismatch into HTTP 500.
    const outputContractAvailable = await this.dailyTaskOutputContractAvailable();

    return prisma.$transaction(async (tx) => {
      const { task, projectId } = await this.assertCanOperateDailyTask(dailyTaskId, user, companyId, tx);

      const requestedStatus = data.status === undefined ? undefined : String(data.status).trim().toUpperCase();
      const statusAliases: Record<string, string> = {
        PENDING: 'IN_PROGRESS',
        ON_PROGRESS: 'IN_PROGRESS',
        'IN PROGRESS': 'IN_PROGRESS',
        IN_PROGRESS: 'IN_PROGRESS',
        DONE: 'COMPLETED',
        COMPLETED: 'COMPLETED',
        NOT_STARTED: 'NOT_STARTED',
        BLOCKED: 'BLOCKED',
      };
      if (requestedStatus && !statusAliases[requestedStatus]) {
        throw new ValidationError('Status Daily Task tidak valid.');
      }
      let status = requestedStatus ? statusAliases[requestedStatus] : task.status;

      const checklist = await tx.project_control_item.findMany({
        where: { daily_task_id: dailyTaskId, company_id: companyId },
        select: { status: true },
      });
      const completedStates = new Set(['DONE', 'COMPLETED', 'CHECKED', 'APPROVED']);
      const completedChecklistCount = checklist.filter((item) => completedStates.has(item.status.toUpperCase())).length;
      const progress = checklist.length > 0
        ? Math.round((completedChecklistCount / checklist.length) * 10000) / 100
        : completedStates.has(String(status).toUpperCase()) ? 100 : 0;

      if (checklist.length > 0 && status !== 'BLOCKED') {
        status = completedChecklistCount === checklist.length
          ? 'COMPLETED'
          : completedChecklistCount > 0 ? 'IN_PROGRESS' : 'NOT_STARTED';
      }

      let isBlocked = data.is_blocked !== undefined
        ? Boolean(data.is_blocked)
        : status === 'BLOCKED' ? true : task.is_blocked;
      let blockReason = task.block_reason;

      if (data.is_blocked !== undefined) {
        if (isBlocked) {
          status = 'BLOCKED';
          blockReason = data.block_reason ?? '';
        } else {
          if (status === 'BLOCKED') status = progress > 0 ? 'IN_PROGRESS' : 'NOT_STARTED';
          blockReason = '';
        }
      }
      if (isBlocked) {
        blockReason = String(data.block_reason ?? blockReason ?? '').trim();
        if (!blockReason) throw new ValidationError('Alasan kendala wajib diisi saat Daily Task diblokir.');
      }

      const existingOutputTarget = String(task.output_target ?? '').trim();
      const requestedOutputTarget = data.output_target === undefined ? undefined : String(data.output_target).trim();
      if (requestedOutputTarget !== undefined && existingOutputTarget) {
        throw new ValidationError('Output Target tidak dapat diubah setelah ditetapkan.');
      }
      if (requestedOutputTarget !== undefined && !requestedOutputTarget) {
        throw new ValidationError('Output Target tidak boleh kosong.');
      }

      const outputContractRequested = requestedOutputTarget !== undefined
        || data.output_result !== undefined
        || status === 'COMPLETED';
      if (!outputContractAvailable && outputContractRequested) {
        throw new ConflictError(
          'Database production belum memiliki kontrak kolom Output Comparison Daily Task. Jalankan migration production (npm run deploy:hostinger:db) sebelum menyimpan Output Target/Hasil atau menyelesaikan Daily Task.',
        );
      }

      const outputTarget = existingOutputTarget || requestedOutputTarget || '';
      const outputResult = String(data.output_result !== undefined ? data.output_result : task.output_result ?? '').trim();
      if (status === 'COMPLETED' && !outputResult) {
        throw new ValidationError('Output Hasil wajib diisi sebelum Daily Task dapat diselesaikan.');
      }
      if (status === 'COMPLETED' && !outputTarget) {
        throw new ValidationError('Output Target wajib diisi sebelum Daily Task dapat diselesaikan.');
      }
      const outputComparison = compareTaskOutput(outputTarget, outputResult);

      const baseUpdateData = {
        title: data.title ?? data.activity_input ?? task.title,
        description: data.description !== undefined ? data.description : task.description,
        time_slot: data.time_slot !== undefined ? data.time_slot : task.time_slot,
        output_result: outputResult,
        notes: data.notes !== undefined ? data.notes : task.notes,
        progress,
        status,
        is_blocked: isBlocked,
        block_reason: blockReason,
        updated_at: new Date(),
      };

      const updated = outputContractAvailable
        ? await tx.project_daily_task.update({
            where: { id: dailyTaskId },
            data: {
              ...baseUpdateData,
              output_target: outputTarget,
              output_similarity_score: outputComparison.score,
              output_review_category: outputComparison.category,
            },
          })
        : await tx.project_daily_task.update({
            where: { id: dailyTaskId },
            data: baseUpdateData,
            select: DAILY_TASK_LEGACY_MUTATION_SELECT,
          });

      if (projectId) {
        await this.logActivity({
          projectId,
          tenantId: task.tenant_id,
          companyId,
          actorId: user?.id,
          taskLevel: 'DAILY',
          taskId: dailyTaskId,
          taskTitle: updated.title,
          action: 'PROGRESS_UPDATED',
          fieldName: 'progress/status',
          oldValue: `${task.progress}% (${task.status})`,
          newValue: `${updated.progress}% (${updated.status})`,
          reason: blockReason || 'Regular progress update',
        }, tx);
      }

      await this.recalculateTaskTree({ dailyTaskId, companyId }, tx);
      return updated;
    }, PROJECT_TRANSACTION_OPTIONS);
  }

'''
          text = text[:method_start] + new_method + text[method_end:]

          old_report = """      const updated = await tx.project_daily_task.update({
        where: { id: dailyTaskId },
        data: {
          is_blocked: true,
          status: 'BLOCKED',
          block_reason: reason,
          updated_at: new Date(),
        },
      });"""
          new_report = """      const updated = await tx.project_daily_task.update({
        where: { id: dailyTaskId },
        data: {
          is_blocked: true,
          status: 'BLOCKED',
          block_reason: reason,
          updated_at: new Date(),
        },
        select: DAILY_TASK_LEGACY_MUTATION_SELECT,
      });"""
          if old_report not in text:
              raise SystemExit('reportBlocked Daily Task update block not found')
          text = text.replace(old_report, new_report, 1)

          old_reassign = """      const updated = await tx.project_daily_task.update({
        where: { id: dailyTaskId },
        data: {
          owner_id: targetUserId,
          updated_at: new Date(),
        },
      });"""
          new_reassign = """      const updated = await tx.project_daily_task.update({
        where: { id: dailyTaskId },
        data: {
          owner_id: targetUserId,
          updated_at: new Date(),
        },
        select: DAILY_TASK_LEGACY_MUTATION_SELECT,
      });"""
          if old_reassign not in text:
              raise SystemExit('directReassign Daily Task update block not found')
          text = text.replace(old_reassign, new_reassign, 1)

          old_transfer_read = """      const task = await tx.project_daily_task.findFirst({ where: { id: transfer.daily_task_id, company_id: companyId } });"""
          new_transfer_read = """      const task = transfer.daily_task_id
        ? await this.dailyTaskRecord(transfer.daily_task_id, companyId, tx)
        : null;"""
          if old_transfer_read not in text:
              raise SystemExit('transfer approval Daily Task read block not found')
          text = text.replace(old_transfer_read, new_transfer_read, 1)

          old_transfer_update = """          await tx.project_daily_task.update({
            where: { id: transfer.daily_task_id },
            data: { owner_id: transfer.target_user_id, updated_at: new Date() },
          });"""
          new_transfer_update = """          await tx.project_daily_task.update({
            where: { id: transfer.daily_task_id },
            data: { owner_id: transfer.target_user_id, updated_at: new Date() },
            select: { id: true },
          });"""
          if old_transfer_update not in text:
              raise SystemExit('transfer approval Daily Task update block not found')
          text = text.replace(old_transfer_update, new_transfer_update, 1)

          path.write_text(text)
          PY

          git diff --check

      - name: Commit Daily Task transaction fix
        run: |
          if git diff --quiet -- backend-express/src/modules/projects/projects.service.ts; then
            echo 'No change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend-express/src/modules/projects/projects.service.ts
          git commit -m 'fix(projects): harden Daily Task updates during schema lag'
          git push origin HEAD:master
