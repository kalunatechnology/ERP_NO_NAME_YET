name: Task Multi-Tenant Integrity

on:
  push:
    branches:
      - fix/task-search-multitenant-integrity

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/task-search-multitenant-integrity
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend-express/package-lock.json
            frontend-next/package-lock.json

      - name: Repair patch generator quoting
        run: python3 backend-express/scripts/repair_task_integrity_patch.py

      - name: Apply implementation patch
        run: node backend-express/scripts/apply_task_multitenant_integrity_patch.mjs

      - name: Install backend dependencies
        working-directory: backend-express
        run: npm ci

      - name: Backend typecheck/build
        working-directory: backend-express
        run: npm run build:compile

      - name: Q11 system guardrails
        working-directory: backend-express
        env:
          DATABASE_URL: postgresql://ci_user:ci_pass@127.0.0.1:5432/erp_ci
          DIRECT_URL: postgresql://ci_user:ci_pass@127.0.0.1:5432/erp_ci
          JWT_SECRET: ci-only-not-for-production
          JWT_REFRESH_SECRET: ci-only-refresh-not-for-production
        run: npm run test:q11

      - name: Install frontend dependencies
        working-directory: frontend-next
        run: npm ci

      - name: Frontend build
        working-directory: frontend-next
        run: npm run build

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-express frontend-next
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "fix: enforce task tenant scope and employee provisioning"
          git push origin HEAD:fix/task-search-multitenant-integrity
