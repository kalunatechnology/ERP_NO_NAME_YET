name: ERP Enterprise Gate

on:
  pull_request:
  push:
    branches: [master, production]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-express
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/erp
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-express/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run typecheck
      - name: Verify generated MarBot catalog matches routes and schema
        run: |
          if ! node scripts/generate_marbot_catalog.js --check; then
            node scripts/generate_marbot_catalog.js
            git diff -- src/modules/marbot/resource-catalog.generated.json
            exit 1
          fi
      - run: npm run test:marbot-native
      - run: npm run test:marbot-workflow
      - run: npm run test:marbot-capabilities
      - run: npm run build
      - name: Verify customer receipt input and lifecycle
        run: |
          npx ts-node --files tests/customer-receipt.http.unit.ts
          npx ts-node --files tests/customer-receipt.workflow.http.unit.ts
      - name: Verify project supervisor weekly approval and notifications
        run: npx ts-node --files tests/weekly-shared-review.http.unit.ts
      - name: Verify notification retention scheduler and safe cleanup
        run: npx ts-node --files tests/notification-maintenance.unit.ts
      - run: npm run test:production-seed
      - run: npm run test:migration-convergence
      - run: npm run test:marbot-signature
      - run: npm run test:marbot-tenant
      - run: npm run test:marbot-runtime-v2
      - run: npm run test:marbot-tool-hmac-v2
      - run: npm run test:marbot-control-plane-v2
      - run: npm run test:marbot-project-scope
      - run: npm run test:marbot-secrets
      - run: npm run test:jwt-expiry
      - run: npm run test:project-authority

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - run: npm ci
      - run: npm run build
