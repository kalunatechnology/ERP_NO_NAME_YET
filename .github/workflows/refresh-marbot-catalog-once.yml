name: Refresh MarBot Catalog Once

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/refresh-marbot-catalog-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-express/package-lock.json

      - name: Install backend dependencies
        working-directory: backend-express
        run: npm ci

      - name: Regenerate MarBot resource catalog
        working-directory: backend-express
        run: node scripts/generate_marbot_catalog.js

      - name: Commit generated catalog when changed
        run: |
          if git diff --quiet -- backend-express/src/modules/marbot/resource-catalog.generated.json; then
            echo "MarBot catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-express/src/modules/marbot/resource-catalog.generated.json
          git commit -m "chore(marbot): refresh generated resource catalog"
          git push origin HEAD:master
